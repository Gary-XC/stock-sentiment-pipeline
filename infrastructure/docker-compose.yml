name: stock-sentiment-pipeline

services:
  # ---------------------------------------------------------
  # Zookeeper: Manages Kafka broker metadata and leader election
  # ---------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr,isro"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - stock-pipeline-net

  # ---------------------------------------------------------
  # Kafka: The core message broker for our streaming topics
  # ---------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      ZOOKEEPER_HEALTH_CHECK_ENABLED: "false"
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 86400000
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - stock-pipeline-net
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------
  # PostgreSQL: Our sink database for the joined time-series data
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    ports:
      - "5433:5432" # changed from 5432:5432 to avoid the local Postgres database on WSL
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sentiment_db
    volumes:
      # Persist Postgres data
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stock-pipeline-net

  # ---------------------------------------------------------
  # Airflow Metadata Database 
  # ---------------------------------------------------------
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - stock-pipeline-net

  # ---------------------------------------------------------
  # Airflow Initialization (Creating DB and Admin User)
  # ---------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary"
    depends_on:
      - postgres-airflow
    networks:
      - stock-pipeline-net

  # ---------------------------------------------------------
  # Airflow Scheduler
  # ---------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.8.1
    build: .
    container_name: airflow-scheduler
    restart: always
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: "secret_pipeline_key_123" 
      _PIP_ADDITIONAL_REQUIREMENTS: "yfinance confluent-kafka pyspark==3.5.0 psycopg2-binary vaderSentiment pandas pyarrow setuptools sqlalchemy"
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project
    depends_on:
      - airflow-init
    networks:
      - stock-pipeline-net


  # ---------------------------------------------------------
  # Airflow Webserver
  # ---------------------------------------------------------
  airflow-webserver:
    build: .
    container_name: airflow-webserver
    restart: always
    command: webserver
    ports:
      - "8081:8080" 
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: "secret_pipeline_key_123" 
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary sqlalchemy"
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project
    depends_on:
      - airflow-init
    networks:
      - stock-pipeline-net

# ---------------------------------------------------------
# Volumes for persistent storage (Idempotency & Resilience)
# ---------------------------------------------------------
volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  postgres-airflow-data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local

# ---------------------------------------------------------
# Custom bridge network for container-to-container DNS resolution
# ---------------------------------------------------------
networks:
  stock-pipeline-net:
    driver: bridge